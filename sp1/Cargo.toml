[workspace]
resolver = "2"
members = [
  "crates/bench_runner",
  "programs/hash_merkle",
  "programs/recursion_verify",
  "programs/sig_batch",
  "programs/vm_stress",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["gnark-playground"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.10", features = ["v4"] }
ctrlc = "3.4"
bincode = "1.3"
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
sp1-zkvm = "6.0.1"
